        * {

            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;

        body {
            background: #eef4f9;
            min-height: 100vh;
            padding: 2rem 1.2rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            max-width: 1350px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            padding: 2rem 2rem 2.2rem;
            box-shadow: 0 20px 50px rgba(0, 20, 30, 0.12);
            border: 1px solid #e2ecf4;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }
        .header h1 {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.8rem;
            color: #0a2a3b;
        }
        .header h1 i {
            color: #1a6b8a;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .stats {
            background: #e8f0f7;
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            font-size: 0.9rem;
            color: #1f4a62;
            white-space: nowrap;
        }
        .stats i {
            margin-right: 6px;
        }
        .mode-badge {
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .mode-badge.view {
            background: #d4e2ed;
            color: #1f4a62;
        }
        .mode-badge.edit {
            background: #c5e0d4;
            color: #0f553a;
        }
        .mode-badge.loading {
            background: #f0e8c5;
            color: #6b5a1a;
        }
        .unlock-area {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            background: #f4f8fc;
            padding: 0.4rem 1rem 0.4rem 1.5rem;
            border-radius: 60px;
            border: 1px solid #dce8f0;
            margin-top: 0.5rem;
        }
        .unlock-area label {
            font-size: 0.85rem;
            color: #1f4a62;
            font-weight: 500;
        }
        .unlock-area input {
            border: 1px solid #cbd8e3;
            border-radius: 40px;
            padding: 0.35rem 1rem;
            font-size: 0.85rem;
            width: 160px;
            outline: none;
            transition: 0.15s;
            background: white;
        }
        .unlock-area input:focus {
            border-color: #1a6b8a;
            box-shadow: 0 0 0 3px rgba(26, 107, 138, 0.15);
        }
        .unlock-area .btn-unlock {
            background: #1a6b8a;
            border: none;
            color: white;
            padding: 0.35rem 1.2rem;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        .unlock-area .btn-unlock:hover {
            background: #0f5772;
        }
        .unlock-status {
            font-size: 0.8rem;
            color: #567e99;
        }
        .unlock-status.error {
            color: #b13b3b;
        }
        .unlock-status.success {
            color: #1a8a5a;
        }
        .edit-toolbar {
            display: none;
            gap: 10px;
            flex-wrap: wrap;
            margin: 0.8rem 0 0.2rem 0;
        }
        .edit-toolbar.show {
            display: flex;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            border: none;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-primary {
            background: #1a6b8a;
            color: white;
            box-shadow: 0 4px 12px rgba(26, 107, 138, 0.25);
        }
        .btn-primary:hover {
            background: #0f5772;
            transform: scale(1.02);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #b0c8d8;
            color: #1f3e4f;
        }
        .btn-outline:hover {
            background: #e5eef5;
        }
        .btn-danger-outline {
            border-color: #dbb6b6;
            color: #a04040;
        }
        .btn-danger-outline:hover {
            background: #fce8e8;
        }
        .btn-sync {
            background: #10b981;
            color: white;
        }
        .btn-sync:hover {
            background: #059669;
        }
        .btn-sync:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .table-wrapper {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid #dce8f0;
            margin-top: 1rem;
            background: #fafcfe;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
            min-width: 880px;
        }
        th {
            text-align: left;
            padding: 0.9rem 0.8rem 0.7rem 1rem;
            font-weight: 600;
            color: #1a4055;
            background: #f0f6fc;
            border-bottom: 2px solid #d0dfea;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        td {
            padding: 0.5rem 0.8rem 0.5rem 1rem;
            border-bottom: 1px solid #e8eff5;
            vertical-align: middle;
            background: white;
            color: #1a2f3d;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .editable-field {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 20px;
            padding: 0.25rem 0.6rem;
            width: 100%;
            font-size: 0.88rem;
            color: #0b2b3d;
            transition: all 0.12s;
            min-width: 50px;
        }
        .editable-field.code {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            max-width: 70px;
        }
        .editable-field.country {
            font-weight: 500;
            text-transform: uppercase;
            max-width: 70px;
        }
        .editable-field.website,
        .editable-field.checkin {
            font-family: 'Segoe UI', monospace;
            font-size: 0.82rem;
        }
        .editable-field.phone {
            font-weight: 500;
        }
        .view-mode .editable-field {
            border-color: transparent !important;
            background: transparent !important;
            cursor: default;
            pointer-events: none;
            box-shadow: none !important;
        }
        .view-mode .editable-field:hover {
            border-color: transparent !important;
            background: transparent !important;
            box-shadow: none !important;
        }
        .edit-mode .editable-field:hover {
            background: white;
            border-color: #b6d2e5;
            box-shadow: 0 0 0 3px rgba(26, 107, 138, 0.05);
        }
        .edit-mode .editable-field:focus {
            outline: none;
            background: white;
            border-color: #1a6b8a;
            box-shadow: 0 0 0 4px rgba(26, 107, 138, 0.12);
        }
        .code-display {
            font-weight: 700;
            color: #0b425a;
            letter-spacing: 0.5px;
        }
        .country-display {
            font-weight: 500;
            text-transform: uppercase;
            color: #2a5a74;
            font-size: 0.82rem;
        }
        .link-cell a {
            color: #1a6b8a;
            text-decoration: none;
            border-bottom: 1px dashed #b6d2e5;
            transition: 0.15s;
            word-break: break-all;
        }
        .link-cell a:hover {
            color: #0e4f68;
            border-bottom-color: #1a6b8a;
        }
        .phone-display {
            font-weight: 500;
            color: #0b2f40;
        }

            text-align: center;
            color: #8aa9c0;
            font-style: italic;
            background: #f8fbfe;
        }

            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 0.8rem;
            color: #567e99;
            border-top: 1px solid #e2ecf4;
            padding-top: 1rem;
        }

            background: #eef4f9;
            padding: 0.15rem 1rem;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .sync-status {
            font-size: 0.8rem;
            color: #567e99;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sync-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .sync-status .dot.green {
            background: #10b981;
        }
        .sync-status .dot.yellow {
            background: #f59e0b;
            animation: blink 1s infinite;
        }
        .sync-status .dot.red {
            background: #ef4444;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        @media (max-width: 700px) {

            .header { flex-direction: column; align-items: flex-start; }
            .header-right { width: 100%; flex-wrap: wrap; }
            .unlock-area { width: 100%; justify-content: flex-start; padding: 0.5rem 0.8rem; }
            .unlock-area input { flex: 1; min-width: 100px; }
            td, th { padding: 0.4rem 0.3rem; }
            table { font-size: 0.78rem; min-width: 700px; }
            .editable-field { font-size: 0.78rem; padding: 0.15rem 0.3rem; min-width: 30px; }
        }

</head>

                { code: "DL", name: "达美航空", country: "US", website: "www.delta.com", checkin: "www.delta.com/checkin",
                    phone: "400-882-8855" },
                { code: "F9", name: "边疆航空", country: "US", website: "www.flyfrontier.com", checkin: "www.flyfrontier.com/checkin",
                    phone: "400-882-8855" },
                { code: "OD", name: "马印航空", country: "MY", website: "www.malindoair.com", checkin: "www.malindoair.com/checkin",
                    phone: "400-882-8855" },
                { code: "SU", name: "俄罗斯航空", country: "RU", website: "www.aeroflot.ru", checkin: "www.aeroflot.ru/checkin",
                    phone: "400-882-8855" },
                { code: "AF", name: "法国航空", country: "FR", website: "www.airfrance.com", checkin: "www.airfrance.com/checkin",
                    phone: "400-882-8855" },
                { code: "VB", name: "Viva Aerobus", country: "MX", website: "www.vivaaerobus.com",
                    checkin: "www.vivaaerobus.com/checkin", phone: "400-882-8855" },
                { code: "UA", name: "美联航", country: "US", website: "www.united.com", checkin: "www.united.com/checkin",
                    phone: "400-882-8855" },
                { code: "AK", name: "亚洲航空", country: "MY", website: "www.airasia.com", checkin: "www.airasia.com/checkin",
                    phone: "400-882-8855" },
                { code: "FY", name: "飞萤航空", country: "MY", website: "www.fireflyz.com.my", checkin: "www.fireflyz.com.my/checkin",
                    phone: "400-882-8855" }
            ];

            let airlines = [];
            let isEditMode = false;
            let isSyncing = false;
            let supabaseClient = null;

            const tbody = document.getElementById('tableBody');
            const countDisplay = document.getElementById('countDisplay');
            const passwordInput = document.getElementById('passwordInput');
            const unlockBtn = document.getElementById('unlockBtn');
            const unlockStatus = document.getElementById('unlockStatus');
            const modeBadge = document.getElementById('modeBadge');
            const editToolbar = document.getElementById('editToolbar');
            const addBtn = document.getElementById('addRowBtn');
            const resetBtn = document.getElementById('resetDefaultBtn');
            const lockBtn = document.getElementById('lockBtn');
            const syncBtn = document.getElementById('syncBtn');
            const container = document.getElementById('appContainer');
            const syncDot = document.getElementById('syncDot');
            const syncText = document.getElementById('syncText');

            function initSupabase() {
                try {
                    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    setSyncStatus('loading', '已连接');
                    return client;
                } catch (e) {
                    console.error('Supabase 初始化失败:', e);
                    setSyncStatus('error', '连接失败');
                    return null;
                }
            }

            function setSyncStatus(status, text) {
                syncDot.className = 'dot';
                if (status === 'success') {
                    syncDot.classList.add('green');
                    syncText.textContent = text || '已同步';
                } else if (status === 'loading') {
                    syncDot.classList.add('yellow');
                    syncText.textContent = text || '同步中...';
                } else if (status === 'error') {
                    syncDot.classList.add('red');
                    syncText.textContent = text || '同步异常';
                } else {
                    syncDot.classList.add('yellow');
                    syncText.textContent = text || '等待中';
                }
            }

            async function loadFromCloud() {
                if (!supabaseClient) {
                    supabaseClient = initSupabase();
                    if (!supabaseClient) return false;
                }

                try {
                    setSyncStatus('loading', '加载中...');
                    const { data, error } = await supabaseClient
                        .from('airlines_data')
                        .select('*')
                        .order('id', { ascending: true });

                    if (error) {
                        console.error('加载数据失败:', error);
                        setSyncStatus('error', '加载失败');
                        return false;
                    }

                    if (data && data.length > 0) {
                        airlines = data.map(item => ({
                            code: item.code || '',
                            name: item.name || '',
                            country: item.country || '',
                            website: item.website || '',
                            checkin: item.checkin || '',
                            phone: item.phone || ''
                        }));
                        setSyncStatus('success', `已加载 ${airlines.length} 条`);
                        return true;
                    } else {
                        airlines = DEFAULT_AIRLINES.map(item => ({ ...item }));
                        setSyncStatus('loading', '初始化数据...');
                        await uploadToCloud();
                        return true;
                    }
                } catch (e) {
                    console.error('加载异常:', e);
                    setSyncStatus('error', '加载异常');
                    return false;
                }
            }

            async function uploadToCloud() {
                if (!supabaseClient) {
                    supabaseClient = initSupabase();
                    if (!supabaseClient) return false;
                }

                if (!airlines || airlines.length === 0) {
                    setSyncStatus('error', '无数据可上传');
                    return false;
                }

                try {
                    setSyncStatus('loading', '上传中...');
                    await supabaseClient.from('airlines_data').delete().neq('id', 0);

                    const dataToInsert = airlines.map(item => ({
                        code: item.code || '',
                        name: item.name || '',
                        country: item.country || '',
                        website: item.website || '',
                        checkin: item.checkin || '',
                        phone: item.phone || ''
                    }));

                    const { error } = await supabaseClient
                        .from('airlines_data')
                        .insert(dataToInsert);

                    if (error) {
                        console.error('上传失败:', error);
                        setSyncStatus('error', '上传失败');
                        return false;
                    }

                    setSyncStatus('success', `已同步 ${airlines.length} 条`);
                    return true;
                } catch (e) {
                    console.error('上传异常:', e);
                    setSyncStatus('error', '上传异常');
                    return false;
                }
            }

            function renderTable() {
                if (!airlines || airlines.length === 0) {
                    tbody.innerHTML =
                        `
                        <tr class="empty-row">
                            <td colspan="6"><i class="fas fa-info-circle" style="margin-right:8px;"></i>暂无航司数据，请解锁后添加</td>
                        </tr>
                    `;
                    updateCounter();
                    return;
                }

                let html = '';
                airlines.forEach((item, index) => {
                    const code = item.code || '';
                    const name = item.name || '';
                    const country = item.country || '';
                    const website = item.website || '';
                    const checkin = item.checkin || '';
                    const phone = item.phone || '';

                    if (isEditMode) {
                        html += `<tr data-index="${index}">
                            <td><input type="text" class="editable-field code" data-field="code" value="${escapeHtml(code)}" placeholder="CA" maxlength="6"></td>
                            <td><input type="text" class="editable-field" data-field="name" value="${escapeHtml(name)}" placeholder="航司名称"></td>
                            <td><input type="text" class="editable-field country" data-field="country" value="${escapeHtml(country)}" placeholder="CN" maxlength="6"></td>
                            <td><input type="text" class="editable-field website" data-field="website" value="${escapeHtml(website)}" placeholder="官网链接"></td>
                            <td><input type="text" class="editable-field checkin" data-field="checkin" value="${escapeHtml(checkin)}" placeholder="值机链接"></td>
                            <td><input type="text" class="editable-field phone" data-field="phone" value="${escapeHtml(phone)}" placeholder="联系方式"></td>
                        </tr>`;
                    } else {
                        const websiteHref = website ? (website.startsWith('http') ? website : 'https://' + website) :
                        '#';
                        const checkinHref = checkin ? (checkin.startsWith('http') ? checkin : 'https://' + checkin) :
                        '#';
                        html += `<tr>
                            <td class="code-display">${escapeHtml(code)}</td>
                            <td><strong>${escapeHtml(name)}</strong></td>
                            <td class="country-display">${escapeHtml(country)}</td>
                            <td class="link-cell">${website ? `<a href="${escapeHtml(websiteHref)}" target="_blank" rel="noopener">${escapeHtml(website)}</a>` : '-'}</td>
                            <td class="link-cell">${checkin ? `<a href="${escapeHtml(checkinHref)}" target="_blank" rel="noopener">${escapeHtml(checkin)}</a>` : '-'}</td>
                            <td class="phone-display">${escapeHtml(phone)}</td>
                        </tr>`;
                    }
                });

                tbody.innerHTML = html;
                updateCounter();

                if (isEditMode) {
                    tbody.querySelectorAll('.editable-field').forEach(input => {
                        input.addEventListener('input', function() {
                            const row = this.closest('tr');
                            if (!row) return;
                            const idx = parseInt(row.dataset.index, 10);
                            if (isNaN(idx) || idx < 0 || idx >= airlines.length) return;
                            const field = this.dataset.field;
                            if (field) {
                                airlines[idx][field] = this.value;
                            }
                        });
                        input.addEventListener('focus', function() { this.select(); });
                    });
                }
                container.classList.toggle('view-mode', !isEditMode);
                container.classList.toggle('edit-mode', isEditMode);
            }

            function escapeHtml(text) {
                if (!text) return '';
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
                return text.replace(/[&<>"']/g, function(m) { return map[m]; });
            }

            function updateCounter() {
                countDisplay.textContent = airlines.length;
            }

            function resetToDefault() {
                airlines = DEFAULT_AIRLINES.map(item => ({ ...item }));
                renderTable();
            }

            function addNewAirline() {
                if (!isEditMode) return;
                airlines.push({ code: '', name: '新航司', country: '', website: '', checkin: '', phone: '' });
                renderTable();
                const rows = tbody.querySelectorAll('tr');
                if (rows.length) {
                    const lastRow = rows[rows.length - 1];
                    const nameInput = lastRow.querySelector('input[data-field="name"]');
                    if (nameInput) {
                        setTimeout(() => { nameInput.focus();
                            nameInput.select(); }, 50);
                    }
                }
            }

            function setEditMode(enabled) {
                isEditMode = enabled;
                if (enabled) {
                    modeBadge.className = 'mode-badge edit';
                    modeBadge.innerHTML = '<i class="fas fa-pen"></i> 编辑模式';
                    unlockStatus.textContent = '🔓 可编辑';
                    unlockStatus.className = 'unlock-status success';
                    unlockBtn.textContent = '锁定';
                    editToolbar.className = 'edit-toolbar show';
                    passwordInput.value = '';
                    passwordInput.placeholder = '已解锁';
                } else {
                    modeBadge.className = 'mode-badge view';
                    modeBadge.innerHTML = '<i class="fas fa-eye"></i> 查看模式';
                    unlockStatus.textContent = '🔒 只读';
                    unlockStatus.className = 'unlock-status';
                    unlockBtn.textContent = '解锁编辑';
                    editToolbar.className = 'edit-toolbar';
                    passwordInput.value = '';
                    passwordInput.placeholder = '输入密码解锁编辑';
                }
                renderTable();
            }

            function tryUnlock() {
                const input = passwordInput.value.trim();
                if (isEditMode) {
                    setEditMode(false);
                    return;
                }
                if (input === EDIT_PASSWORD) {
                    setEditMode(true);
                    passwordInput.value = '';
                } else {
                    unlockStatus.textContent = '❌ 密码错误';
                    unlockStatus.className = 'unlock-status error';
                    passwordInput.value = '';
                    setTimeout(() => {
                        unlockStatus.textContent = '🔒 只读';
                        unlockStatus.className = 'unlock-status';
                    }, 1500);
                }
            }

            async function init() {
                supabaseClient = initSupabase();
                if (supabaseClient) {
                    await loadFromCloud();
                } else {
                    airlines = DEFAULT_AIRLINES.map(item => ({ ...item }));
                    setSyncStatus('error', '离线模式');
                }
                renderTable();
                setEditMode(false);

                unlockBtn.addEventListener('click', tryUnlock);
                passwordInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') { e.preventDefault();
                        tryUnlock(); }
                });
                addBtn.addEventListener('click', addNewAirline);
                resetBtn.addEventListener('click', function() {
                    if (confirm('重置将恢复默认航司列表，当前修改会丢失。确定吗？')) resetToDefault();
                });
                lockBtn.addEventListener('click', function() {
                    setEditMode(false);
                });
                syncBtn.addEventListener('click', async function() {
                    if (isSyncing) return;
                    isSyncing = true;
                    syncBtn.disabled = true;
                    await uploadToCloud();
                    isSyncing = false;
                    syncBtn.disabled = false;
                });
            }

            init();
        })();
    </script>
</body>
</html>
